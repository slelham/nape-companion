name: CI

on:
  push:
  pull_request:

jobs:
  protocol:
    name: Protocol tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Run protocol tests
        run: swift test

  macos:
    name: macOS tests and app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run protocol tests
        run: swift test
      - name: Build the local app
        run: ./build.sh
      - name: Check the executable
        run: test -x "build/Nape Companion.app/Contents/MacOS/NapeCompanion"
      - name: Show the ad-hoc signature
        run: codesign -dv "build/Nape Companion.app"
